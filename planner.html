<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week Planner</title>
<meta name="description" content="Plan the week's meals and build a shopping list. Saved on this device; share by export/import.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--
  Week planner + shopping list. Recipes come from the repo's .md files (same
  source as index.html). The plan is saved in this browser's localStorage and
  moved between devices with Export / Import (a .json file or a share link).
-->
<div class="page stack" style="gap:22px">
  <div class="topbar">
    <a class="back" href="./">← Recipes</a>
    <button class="btn btn-secondary" id="menu-btn" aria-haspopup="true" aria-expanded="false" style="padding:6px 12px">Share &amp; file</button>
    <div class="menu elev-md" id="menu" hidden>
      <button class="btn btn-ghost" id="export-file">Export file</button>
      <button class="btn btn-ghost" id="copy-link">Copy share link</button>
      <button class="btn btn-ghost" id="import-btn">Import</button>
      <button class="btn btn-ghost sep" id="clear-week">New week</button>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>

  <header class="planner-head">
    <h1>Week Planner</h1>
    <p id="subtitle">Pick the week's meals, see daily totals, and get a shopping list. Saved on this device only.</p>
  </header>

  <div class="seg tabs" role="tablist">
    <button class="seg-opt" data-view="week">This Week</button>
    <button class="seg-opt" data-view="shop">Shopping List · <span id="remaining">0</span></button>
  </div>

  <main id="app" class="stack" style="gap:22px"><p class="muted">Loading recipes…</p></main>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-h">
  <form method="dialog" class="sheet-body">
    <div class="sheet-title"><h3 id="sheet-h">Add a meal</h3><span id="sheet-where"></span></div>
    <label class="visually-hidden" for="sheet-q">Search recipes</label>
    <input class="input" type="search" id="sheet-q" placeholder="Search recipes" autocomplete="off">
    <div class="pick-list" id="pick-list"></div>
    <div class="field">
      <label>Meals it covers</label>
      <div class="seg cover" id="cover"></div>
      <p class="cover-note">Extra meals go on the following days as leftovers. <span id="cover-note"></span></p>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" value="cancel">Cancel</button>
      <button class="btn btn-primary blueprint" value="add" id="sheet-add" disabled><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>Add</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // ---- Config -------------------------------------------------------------
  const REPO = "HaderlieHome/meal-plan";
  const BRANCH = "main";
  const MEALS = ["Breakfast", "Lunch", "Dinner", "Snack"];
  const SLOT_LABEL = { Breakfast: "Bkfst", Lunch: "Lunch", Dinner: "Dinner", Snack: "Snack" };
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const STORE_KEY = "mp-planner-v1";
  const corners = `<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>`;
  const ICON_PLUS = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`;
  const ICON_X = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`;

  const app = document.getElementById("app");
  let recipes = [];
  let byKey = {};
  let view = "week";

  // ---- Helpers ------------------------------------------------------------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = s => s.toLowerCase().trim().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-");
  const pretty = s => s.replace(/-/g, " ").replace(/^\w/, c => c.toUpperCase());
  const num = s => (s == null ? null : parseFloat(String(s).replace(/,/g, "")));
  const fmt = n => Math.round(n).toLocaleString("en-US");
  const keyOf = r => `${r.path}#${r.anchor}`;
  const toast = msg => { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); };

  // ---- State (localStorage) -----------------------------------------------
  const emptyPlan = () => ({ version: 1, days: Object.fromEntries(DAYS.map(d => [d, Object.fromEntries(MEALS.map(m => [m, []]))])), checked: {}, custom: [] });
  let plan = emptyPlan();

  function normalize(p) {
    const base = emptyPlan();
    if (!p || typeof p !== "object" || !p.days) throw new Error("Not a meal plan file");
    for (const d of DAYS) for (const m of MEALS) {
      const list = p.days?.[d]?.[m];
      if (Array.isArray(list)) base.days[d][m] = list.filter(e => e && typeof e.key === "string").map(e => ({ key: e.key, leftover: !!e.leftover }));
    }
    if (p.checked && typeof p.checked === "object") base.checked = p.checked;
    if (Array.isArray(p.custom)) base.custom = p.custom.filter(x => typeof x === "string");
    return base;
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(plan)); } catch {} }
  function loadSaved() { try { const raw = localStorage.getItem(STORE_KEY); if (raw) plan = normalize(JSON.parse(raw)); } catch {} }

  // ---- Recipes (read from the .md files) ----------------------------------
  function field(body, name) { const m = body.match(new RegExp(`\\*\\*${name}:\\*\\*\\s*([^·\\n]+)`)); return m ? m[1].trim() : ""; }
  function nutrient(body, name) { const m = body.match(new RegExp(`^\\|\\s*${name}\\s*\\|\\s*~?([\\d,.]+)`, "m")); return m ? num(m[1]) : null; }
  function ingredients(body) {
    const m = body.match(/^### Ingredients[^\n]*\n([\s\S]*?)(?=^### )/m);
    if (!m) return [];
    return m[1].split("\n").filter(l => /^\s*- /.test(l)).map(l => l.replace(/^\s*- /, "").replace(/\*\*/g, "").trim());
  }
  function parseFile(path, text) {
    const [meal, file] = path.split("/");
    return text.split(/^## /m).slice(1).map(chunk => {
      const nl = chunk.indexOf("\n");
      const title = chunk.slice(0, nl).trim();
      const body = chunk.slice(nl + 1);
      const servings = num((field(body, "Serves").match(/\d+/) || [])[0]) || 2;
      return {
        path, meal, protein: pretty(file.replace(/\.md$/, "")), title, anchor: slug(title),
        mealsForTwo: Math.max(1, Math.floor(servings / 2)),
        kcal: nutrient(body, "Calories"), protein_g: nutrient(body, "Protein"),
        ingredients: ingredients(body),
      };
    });
  }
  async function load() {
    let files;
    try { files = JSON.parse(sessionStorage.getItem("mp-tree") || "null"); } catch {}
    if (!files) {
      const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`);
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      files = (await res.json()).tree.map(t => t.path).filter(p => /^[^/]+\/[^/]+\.md$/.test(p) && MEALS.includes(p.split("/")[0]));
      try { sessionStorage.setItem("mp-tree", JSON.stringify(files)); } catch {}
    }
    const texts = await Promise.all(files.map(async p => {
      let res = await fetch(p, { cache: "no-cache" }).catch(() => null);
      if (!res || !res.ok) res = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${p}`);
      return res.ok ? res.text() : "";
    }));
    recipes = files.flatMap((f, i) => parseFile(f, texts[i]));
    byKey = Object.fromEntries(recipes.map(r => [keyOf(r), r]));
  }

  // ---- Week view ----------------------------------------------------------
  const allEntries = () => DAYS.flatMap(d => MEALS.flatMap(m => plan.days[d][m]));
  function dayTotals(d) {
    let kcal = 0, protein = 0, cook = false;
    for (const m of MEALS) for (const e of plan.days[d][m]) {
      const r = byKey[e.key]; if (!r) continue;
      kcal += r.kcal || 0; protein += r.protein_g || 0;
      if (!e.leftover) cook = true;
    }
    return { kcal, protein, cook };
  }

  function renderWeek() {
    const totals = DAYS.map(dayTotals);
    const planned = totals.filter(t => t.kcal > 0);
    const avg = k => (planned.length ? planned.reduce((s, t) => s + t[k], 0) / planned.length : 0);
    const cookDays = totals.filter(t => t.cook).length;
    app.innerHTML = `
      <div class="stats">
        <div><span class="micro">Avg protein</span><b class="accent">${planned.length ? fmt(avg("protein")) + "g" : "–"}</b></div>
        <div><span class="micro">Avg kcal</span><b>${planned.length ? fmt(avg("kcal")) : "–"}</b></div>
        <div><span class="micro">Cook days</span><b>${cookDays}</b></div>
      </div>
      ${allEntries().length ? "" : `<div class="notice">Tap <b>+</b> on any meal to add a recipe. Batch recipes can fill several days at once, and leftovers aren't added to the shopping list twice.</div>`}
      <div class="days">${DAYS.map((d, di) => {
        const t = totals[di];
        return `<section class="day blueprint">${corners}
          <div class="day-head">
            <span class="name">${d}</span>
            <span class="totals">${fmt(t.kcal)} kcal · <strong>${fmt(t.protein)}g</strong>${t.kcal > 2000 ? ` <span class="over">· over 2,000</span>` : ""}</span>
          </div>
          ${MEALS.map(m => `<div class="slot">
            <span class="slot-label">${SLOT_LABEL[m]}</span>
            <div class="slot-entries">${plan.days[d][m].length ? plan.days[d][m].map((e, i) => {
              const r = byKey[e.key];
              const title = r ? esc(r.title) : `<span class="muted">Missing recipe</span>`;
              const href = r ? `./#/${encodeURI(r.path)}/${r.anchor}` : "#";
              return `<div class="entry">
                <a href="${href}" title="${r ? `${r.kcal ?? "–"} kcal · ${r.protein_g ?? "–"} g protein` : ""}">${title}</a>
                <span class="tag ${e.leftover ? "tag-neutral" : "tag-accent"}">${e.leftover ? "Leftover" : "Cook"}</span>
                <button class="btn btn-icon sm" aria-label="Remove" data-del="${d}|${m}|${i}">${ICON_X}</button>
              </div>`;
            }).join("") : `<span class="slot-empty">—</span>`}</div>
            <button class="btn add" aria-label="Add ${m.toLowerCase()} on ${d}" data-add="${d}|${m}">${ICON_PLUS}</button>
          </div>`).join("")}
        </section>`;
      }).join("")}</div>`;
    app.querySelectorAll("[data-add]").forEach(b => b.onclick = () => openSheet(...b.dataset.add.split("|")));
    app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const [d, m, i] = b.dataset.del.split("|");
      plan.days[d][m].splice(+i, 1); save(); render();
    });
  }

  // ---- Add-a-meal sheet ---------------------------------------------------
  const sheet = document.getElementById("sheet");
  const sq = document.getElementById("sheet-q");
  const plist = document.getElementById("pick-list");
  const cover = document.getElementById("cover");
  const addBtn = document.getElementById("sheet-add");
  let pick = { day: null, meal: null, key: null, n: 1 };

  function openSheet(day, meal) {
    pick = { day, meal, key: null, n: 1 };
    document.getElementById("sheet-where").textContent = `${day} · ${meal}`;
    sq.value = ""; addBtn.disabled = true;
    renderPicks(); renderCover();
    sheet.showModal();
  }
  function renderPicks() {
    const q = sq.value.toLowerCase();
    // This meal time's recipes first, then everything else (e.g. leftover dinner for lunch).
    const list = recipes
      .filter(r => !q || (r.title + " " + r.protein + " " + r.meal).toLowerCase().includes(q))
      .sort((a, b) => (b.meal === pick.meal) - (a.meal === pick.meal) || a.protein.localeCompare(b.protein) || a.title.localeCompare(b.title));
    plist.innerHTML = list.map(r => `<button type="button" class="pick" data-key="${esc(keyOf(r))}" aria-pressed="${pick.key === keyOf(r)}">
        <span class="dot"></span>
        <span><span class="pick-name">${esc(r.title)}</span><span class="pick-sub">${esc(r.meal)} · ${esc(r.protein)}${r.mealsForTwo > 1 ? ` · makes ${r.mealsForTwo} meals for two` : ""}</span></span>
        <span class="pick-nums"><strong>${r.protein_g ?? "–"}g</strong> · ${r.kcal ?? "–"}</span>
      </button>`).join("") || `<p class="muted" style="padding:12px 0">No recipes match.</p>`;
    plist.querySelectorAll(".pick").forEach(b => b.onclick = () => {
      pick.key = b.dataset.key;
      pick.n = Math.min(byKey[pick.key].mealsForTwo, DAYS.length - DAYS.indexOf(pick.day));
      addBtn.disabled = false;
      plist.querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", x === b));
      renderCover();
    });
  }
  function renderCover() {
    const left = DAYS.length - DAYS.indexOf(pick.day);
    const max = Math.max(4, pick.key ? byKey[pick.key].mealsForTwo : 1);
    cover.style.gridTemplateColumns = `repeat(${max}, 1fr)`;
    cover.innerHTML = Array.from({ length: max }, (_, i) => i + 1).map(n =>
      `<button type="button" class="seg-opt" data-n="${n}" aria-pressed="${pick.n === n}" ${n > left ? "disabled" : ""}>${n}</button>`).join("");
    cover.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { pick.n = +b.dataset.n; renderCover(); });
    const later = DAYS.slice(DAYS.indexOf(pick.day) + 1, DAYS.indexOf(pick.day) + pick.n);
    document.getElementById("cover-note").textContent = later.length ? `Also fills ${later.join(", ")} ${pick.meal.toLowerCase()}.` : "";
  }
  sq.oninput = renderPicks;
  sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close("cancel"); });
  sheet.addEventListener("close", () => {
    if (sheet.returnValue !== "add" || !pick.key) return;
    const start = DAYS.indexOf(pick.day);
    for (let i = 0; i < pick.n && start + i < DAYS.length; i++) {
      plan.days[DAYS[start + i]][pick.meal].push({ key: pick.key, leftover: i > 0 });
    }
    save(); render();
  });

  // ---- Shopping list ------------------------------------------------------
  const SECTIONS = [
    ["Frozen", /\bfrozen\b/i],
    ["Pantry", /\b(seasoning|spice|spices|whey|protein powder|almond milk|cereal|oats|dried|powder|paprika|cumin|cinnamon|flakes)\b/i],
    ["Canned & Jarred", /\b(canned|can|cans|jar|jarred|pouch|pouches|broth|stock|salsa|marinara|crushed tomatoes|diced tomatoes|tomato paste|coconut milk)\b/i],
    ["Meat & Seafood", /\b(chicken|beef|steak|sirloin|turkey|pork|ham|bacon|sausage|salmon|shrimp|cod|tuna|fish|jerky|beef stick|roast beef|deli)\b/i],
    ["Dairy", /\b(yogurt|cheese|milk|cottage|parmesan|feta|mozzarella|cheddar|swiss|butter|cream|kefir|sour cream|fairlife)\b/i],
    ["Bread & Tortillas", /\b(bread|tortilla|tortillas|pita|bun|buns|wrap|wraps|bagel|english muffin)\b/i],
    ["Produce", /\b(onion|onions|garlic|ginger|carrot|carrots|potato|potatoes|sweet potato|broccoli|cabbage|coleslaw|slaw mix|lettuce|romaine|spinach|kale|salad|tomato|tomatoes|bell pepper|peppers|jalape|zucchini|squash|cucumber|cucumbers|mushroom|mushrooms|celery|avocado|apple|apples|banana|bananas|berries|raspberr|blueberr|strawberr|grapes|pear|pears|clementine|clementines|orange|oranges|lemon|lemons|lime|limes|cilantro|scallion|scallions|green onion|parsley|basil|herbs|edamame|pineapple|corn)\b/i],
  ];
  const sectionOf = text => (SECTIONS.find(([, re]) => re.test(text)) || ["Pantry"])[0];
  const ORDER = ["Produce", "Meat & Seafood", "Dairy", "Bread & Tortillas", "Frozen", "Canned & Jarred", "Pantry", "Extras"];

  function shoppingItems() {
    // Count how many times each recipe gets cooked (leftover entries don't count).
    const cooks = {};
    for (const e of allEntries()) if (!e.leftover) cooks[e.key] = (cooks[e.key] || 0) + 1;
    const items = [];
    for (const [key, times] of Object.entries(cooks)) {
      const r = byKey[key]; if (!r) continue;
      r.ingredients.forEach((ing, i) => items.push({ id: `${key}|${i}|${ing}`, text: ing, times, recipe: r.title, section: sectionOf(ing) }));
    }
    plan.custom.forEach((c, i) => items.push({ id: `custom|${c}`, text: c, times: 1, recipe: null, section: "Extras", customIndex: i }));
    return items;
  }
  function updateRemaining() {
    document.getElementById("remaining").textContent = shoppingItems().filter(i => !plan.checked[i.id]).length;
  }

  function renderShop() {
    const items = shoppingItems();
    const done = items.filter(i => plan.checked[i.id]).length;
    const groups = ORDER.map(s => [s, items.filter(i => i.section === s)]).filter(([, l]) => l.length);
    app.innerHTML = `<div class="shop stack" style="gap:22px">
      ${items.length
        ? `<div class="shop-status"><span>${done} of ${items.length} in the cart</span><button class="btn btn-ghost" id="clear-checks" style="font-size:13px">Clear checks</button></div>`
        : `<div class="notice">The list fills in from the meals on <b>This Week</b>. Amounts are per batch, as written in each recipe.</div>`}
      <div class="add-row">
        <label class="visually-hidden" for="custom-text">Add an item</label>
        <input class="input" id="custom-text" placeholder="Add something else (coffee, paper towels…)">
        <button class="btn btn-secondary" id="custom-add">Add</button>
      </div>
      <div class="stack" style="gap:26px">${groups.map(([s, list]) => `<div class="aisle stack">
        <h6>${s}</h6>
        ${list.map(i => `<div class="item ${plan.checked[i.id] ? "done" : ""}" role="checkbox" tabindex="0" aria-checked="${!!plan.checked[i.id]}" data-id="${esc(i.id)}">
          <span class="box">${plan.checked[i.id] ? "✓" : ""}</span>
          <span><span class="name">${esc(i.text)}</span>${i.recipe ? `<span class="for">${esc(i.recipe)}</span>` : ""}</span>
          ${i.recipe
            ? `<span class="qty">${i.times > 1 ? "×" + i.times : ""}</span>`
            : `<button class="btn btn-icon sm" aria-label="Remove ${esc(i.text)}" data-rm="${i.customIndex}">${ICON_X}</button>`}
        </div>`).join("")}
      </div>`).join("")}</div>
    </div>`;
    const toggle = el => {
      const id = el.dataset.id;
      if (plan.checked[id]) delete plan.checked[id]; else plan.checked[id] = true;
      save(); renderShop(); updateRemaining();
      app.querySelector(`[data-id="${CSS.escape(id)}"]`)?.focus();
    };
    app.querySelectorAll(".item").forEach(el => {
      el.onclick = e => { if (!e.target.closest("[data-rm]")) toggle(el); };
      el.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(el); } };
    });
    app.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { plan.custom.splice(+b.dataset.rm, 1); save(); render(); });
    const input = app.querySelector("#custom-text");
    const addCustom = () => { const v = input.value.trim(); if (!v) return; plan.custom.push(v); save(); render(); app.querySelector("#custom-text").focus(); };
    app.querySelector("#custom-add").onclick = addCustom;
    input.onkeydown = e => { if (e.key === "Enter") addCustom(); };
    const cc = app.querySelector("#clear-checks");
    if (cc) cc.onclick = () => { plan.checked = {}; save(); render(); };
  }

  // ---- Share & file menu --------------------------------------------------
  const menu = document.getElementById("menu");
  const menuBtn = document.getElementById("menu-btn");
  const setMenu = open => { menu.hidden = !open; menuBtn.setAttribute("aria-expanded", open); };
  menuBtn.onclick = e => { e.stopPropagation(); setMenu(menu.hidden); };
  document.addEventListener("click", e => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

  const b64encode = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const b64decode = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));

  function applyImport(data) {
    const next = normalize(data);
    const count = DAYS.flatMap(d => MEALS.flatMap(m => next.days[d][m])).length;
    if (!confirm(`Replace your current week with the imported plan (${count} meals)?`)) return;
    plan = next; save(); render(); toast("Plan imported");
  }
  document.getElementById("export-file").onclick = () => {
    setMenu(false);
    const blob = new Blob([JSON.stringify(plan, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `meal-plan-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.getElementById("copy-link").onclick = async () => {
    setMenu(false);
    const url = `${location.origin}${location.pathname}#import=${b64encode(JSON.stringify(plan))}`;
    try { await navigator.clipboard.writeText(url); toast("Share link copied"); }
    catch { prompt("Copy this link:", url); }
  };
  const fileInput = document.getElementById("import-file");
  document.getElementById("import-btn").onclick = () => { setMenu(false); fileInput.click(); };
  fileInput.onchange = async () => {
    const f = fileInput.files[0]; fileInput.value = "";
    if (!f) return;
    try { applyImport(JSON.parse(await f.text())); } catch (e) { alert("Couldn't import that file: " + e.message); }
  };
  document.getElementById("clear-week").onclick = () => {
    setMenu(false);
    if (!confirm("Clear the whole week and shopping list?")) return;
    plan = emptyPlan(); save(); render();
  };
  function importFromHash() {
    const m = location.hash.match(/^#import=(.+)$/);
    if (!m) return;
    history.replaceState(null, "", location.pathname);
    try { applyImport(JSON.parse(b64decode(m[1]))); } catch (e) { alert("That share link didn't work: " + e.message); }
  }

  // ---- Tabs ---------------------------------------------------------------
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
  function render() {
    document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view));
    document.getElementById("subtitle").textContent = view === "shop"
      ? "Everything on this week's plan, sorted by store section."
      : "Pick the week's meals, see daily totals, and get a shopping list. Saved on this device only.";
    view === "shop" ? renderShop() : renderWeek();
    updateRemaining();
  }

  loadSaved();
  load().then(() => { render(); importFromHash(); }).catch(e => {
    app.innerHTML = `<div class="notice"><b>Couldn't load the recipes.</b> ${esc(e.message)}. If you opened this file straight from disk, serve the folder instead (e.g. VS Code "Live Server"), or open it on GitHub Pages.</div>`;
  });
})();
</script>
</body>
</html>
