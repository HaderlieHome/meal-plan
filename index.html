<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal Plan</title>
<meta name="description" content="High-protein, lazy, meal-prep friendly recipes for two.">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<!--
  This page has no recipe content of its own. It lists the .md files in the
  repo (via the GitHub API), fetches them, and parses/renders them in the
  browser. Edit the Markdown; this page picks it up automatically.
-->
<div class="page stack" style="gap:28px">
  <nav class="nav" style="padding:0;gap:18px">
    <a class="nav-brand" href="#/" style="font-size:18px">Meal Plan</a>
    <a href="planner.html">Planner</a>
    <a href="#/about">About</a>
    <a id="repo-link" href="#">GitHub</a>
  </nav>
  <main id="app" class="stack" style="gap:28px"><p class="muted">Loading recipes…</p></main>
</div>

<script>
(() => {
  // ---- Config -------------------------------------------------------------
  const REPO = "HaderlieHome/meal-plan";
  const BRANCH = "main";
  const MEAL_ORDER = ["Breakfast", "Lunch", "Dinner", "Snack"];
  const STORAGE = {
    freezer: "Freezer-friendly",
    fridge: "Fridge prep",
    fresh: "Cook fresh",
    pantry: "Pantry",
  };
  const SORTS = {
    "Most protein": (a, b) => (b.protein_g ?? 0) - (a.protein_g ?? 0),
    "Protein per kcal": (a, b) => density(b) - density(a),
    "Fewest kcal": (a, b) => (a.kcal ?? 1e9) - (b.kcal ?? 1e9),
    "Quickest": (a, b) => (a.minutes ?? 1e9) - (b.minutes ?? 1e9),
    "A–Z": (a, b) => a.title.localeCompare(b.title),
  };
  const corners = `<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>`;

  document.getElementById("repo-link").href = `https://github.com/${REPO}`;
  const app = document.getElementById("app");
  const state = { meal: "Any", protein: "Any", storage: "Any", sort: "Most protein", q: "", panel: null };
  let recipes = [];
  const fileText = {};

  // ---- Helpers ------------------------------------------------------------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // GitHub-style heading slug, so anchors in the .md index lists match.
  const slug = s => s.toLowerCase().trim().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-");
  const pretty = s => s.replace(/-/g, " ").replace(/^\w/, c => c.toUpperCase());
  const num = s => (s == null ? null : parseFloat(String(s).replace(/,/g, "")));
  const density = r => (r.kcal && r.protein_g ? r.protein_g / r.kcal : 0);
  const ssGet = k => { try { return sessionStorage.getItem(k); } catch { return null; } };
  const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch {} };

  function storageKind(line) {
    if (line.includes("🧊")) return "freezer";
    if (line.includes("🥡")) return "fridge";
    if (line.includes("🔥")) return "fresh";
    return "pantry";
  }
  function field(body, name) {
    const m = body.match(new RegExp(`\\*\\*${name}:\\*\\*\\s*([^·\\n]+)`));
    return m ? m[1].trim() : "";
  }
  function nutrient(body, name) {
    const m = body.match(new RegExp(`^\\|\\s*${name}\\s*\\|\\s*~?([\\d,.]+)`, "m"));
    return m ? num(m[1]) : null;
  }
  // "40 min (hands-on 15)" → 40 · "8 hr on Low" → 480 · "4–6 hr" → 240
  function minutes(time) {
    const hr = time.match(/(\d+)(?:–\d+)?\s*hr/);
    if (hr) return +hr[1] * 60;
    const min = time.match(/(\d+)\s*min/);
    return min ? +min[1] : null;
  }

  // ---- Parse one .md file into recipe objects -----------------------------
  function parseFile(path, text) {
    const [meal, file] = path.split("/");
    const protein = pretty(file.replace(/\.md$/, ""));
    return text.split(/^## /m).slice(1).map(chunk => {
      const nl = chunk.indexOf("\n");
      const title = chunk.slice(0, nl).trim();
      const body = chunk.slice(nl + 1);
      const time = field(body, "Time");
      const serves = field(body, "Serves");
      const ing = (body.match(/^### Ingredients[^\n]*\n([\s\S]*?)(?=^### )/m) || [])[1] || "";
      return {
        path, meal, protein, title, anchor: slug(title),
        time: time.replace(/\s*\(.*$/, ""),
        minutes: minutes(time),
        makes: num((serves.match(/\d+/) || [])[0]),
        kcal: nutrient(body, "Calories"),
        protein_g: nutrient(body, "Protein"),
        storage: storageKind((body.match(/\*\*Storage:\*\*\s*(.+)/) || [])[1] || ""),
        search: (title + " " + protein + " " + meal + " " + ing).toLowerCase(),
        markdown: "## " + chunk.trimEnd(),
      };
    });
  }

  // ---- Load: list .md files from the repo, then fetch each one ------------
  async function listFiles() {
    const cached = ssGet("mp-tree");
    if (cached) return JSON.parse(cached);
    const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const files = (await res.json()).tree
      .map(t => t.path)
      .filter(p => /^[^/]+\/[^/]+\.md$/.test(p) && MEAL_ORDER.includes(p.split("/")[0]));
    ssSet("mp-tree", JSON.stringify(files));
    return files;
  }
  async function fetchText(path) {
    if (fileText[path]) return fileText[path];
    // Same-origin first (GitHub Pages / local server), raw GitHub as fallback.
    let res = await fetch(path, { cache: "no-cache" }).catch(() => null);
    if (!res || !res.ok) res = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${path}`);
    if (!res.ok) throw new Error(`Could not load ${path}`);
    return (fileText[path] = await res.text());
  }
  async function load() {
    const files = await listFiles();
    const texts = await Promise.all(files.map(fetchText));
    recipes = files.flatMap((f, i) => parseFile(f, texts[i]));
  }

  // ---- List view ----------------------------------------------------------
  function groups() {
    const proteins = [...new Set(recipes.filter(r => state.meal === "Any" || r.meal === state.meal).map(r => r.protein))].sort();
    if (state.protein !== "Any" && !proteins.includes(state.protein)) state.protein = "Any";
    return {
      meal: { name: "Meal", opts: ["Any", ...MEAL_ORDER], hint: "Breakfast, lunch, dinner or snack" },
      protein: { name: "Protein", opts: ["Any", ...proteins], hint: "Main protein source" },
      storage: { name: "Storage", opts: ["Any", ...Object.values(STORAGE)], hint: "How well it keeps for meal prep" },
      sort: { name: "Sort", opts: Object.keys(SORTS), hint: "Order of the list below" },
    };
  }
  function filtered() {
    const q = state.q.toLowerCase().trim();
    return recipes
      .filter(r =>
        (state.meal === "Any" || r.meal === state.meal) &&
        (state.protein === "Any" || r.protein === state.protein) &&
        (state.storage === "Any" || STORAGE[r.storage] === state.storage) &&
        (!q || r.search.includes(q)))
      .sort(SORTS[state.sort]);
  }
  function card(r) {
    return `<a class="recipe-card blueprint" href="#/${encodeURI(r.path)}/${r.anchor}">${corners}
      <div class="top">
        <div class="stack" style="gap:2px"><span class="card-kicker" style="color:var(--color-accent-700)">${esc(r.meal)}</span><span class="title">${esc(r.title)}</span></div>
        <div class="protein"><b>${r.protein_g ?? "–"}g</b><span class="micro">protein</span></div>
      </div>
      <div class="facts"><span>${r.kcal ?? "–"} kcal</span>${r.time ? `<span>${esc(r.time)}</span>` : ""}${r.makes ? `<span>Makes ${r.makes}</span>` : ""}</div>
      <div class="tags"><span class="tag tag-neutral">${esc(r.protein)}</span><span class="tag tag-outline">${STORAGE[r.storage]}</span></div>
    </a>`;
  }
  function renderResults() {
    const list = filtered();
    app.querySelector("#results").innerHTML = `
      <div class="list-head"><h2>Sorted by ${esc(state.sort.toLowerCase())}</h2><span>${list.length} recipes · per serving</span></div>
      ${list.length
        ? `<div class="recipes">${list.map(card).join("")}</div>`
        : `<div class="empty"><span>No recipes match these filters.</span><button class="btn btn-secondary" data-clear-all>Clear all</button></div>`}`;
    const clear = app.querySelector("#results [data-clear-all]");
    if (clear) clear.onclick = clearAll;
  }
  function clearAll() { Object.assign(state, { meal: "Any", protein: "Any", storage: "Any", q: "", panel: null }); renderList(); }

  function renderList() {
    const G = groups();
    const active = ["meal", "protein", "storage"].filter(k => state[k] !== "Any");
    const panel = state.panel && G[state.panel];
    app.innerHTML = `
      <header class="hero">
        <span class="eyebrow">Recipes for two</span>
        <h1>High protein.<br>Low effort.</h1>
        <p>High-protein, low-to-mid calorie meals for two. Lazy cooking, meal-prep friendly, and filling for the calories.</p>
      </header>
      <div class="actions">
        <a href="planner.html" class="btn btn-primary blueprint">${corners}Week planner &amp; shopping list<span>→</span></a>
        <a href="#/about" class="btn btn-secondary">About the plan &amp; nutrition targets<span style="color:var(--color-neutral-600)">→</span></a>
      </div>
      <div class="stack" style="gap:12px">
        <label class="visually-hidden" for="q">Search</label>
        <input id="q" class="input" type="search" placeholder="Search recipes or ingredients" value="${esc(state.q)}" style="min-height:44px;background:transparent">
        <div class="filters">${Object.entries(G).map(([k, g]) => `
          <button class="filter-cell${state.panel === k ? " is-open" : ""}${k !== "sort" && state[k] !== "Any" ? " is-set" : ""}" data-panel="${k}" aria-expanded="${state.panel === k}">
            <span class="micro">${g.name}</span><span class="val">${esc(state[k])} ▾</span>
          </button>`).join("")}
        </div>
        ${panel ? `<div class="filter-panel">
          <div class="chips">${panel.opts.map(o => `<button class="chip" data-pick="${esc(o)}" aria-pressed="${state[state.panel] === o}">${esc(o)}</button>`).join("")}</div>
          <span style="font-size:12px;color:var(--color-neutral-600)">${panel.hint}</span>
        </div>` : ""}
        ${active.length ? `<div class="active-chips">
          ${active.map(k => `<button class="tag tag-accent" data-unset="${k}">${esc(state[k])} ×</button>`).join("")}
          <button class="btn btn-ghost" data-clear-all style="font-size:13px">Clear all</button>
        </div>` : ""}
      </div>
      <section id="results" class="stack" style="gap:18px"></section>`;

    app.querySelectorAll("[data-panel]").forEach(b => b.onclick = () => { state.panel = state.panel === b.dataset.panel ? null : b.dataset.panel; renderList(); });
    app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { state[state.panel] = b.dataset.pick; state.panel = null; renderList(); });
    app.querySelectorAll("[data-unset]").forEach(b => b.onclick = () => { state[b.dataset.unset] = "Any"; renderList(); });
    app.querySelectorAll(".active-chips [data-clear-all]").forEach(b => b.onclick = clearAll);
    const q = app.querySelector("#q");
    q.oninput = () => { state.q = q.value; renderResults(); };
    renderResults();
  }

  // ---- Document view (a recipe, or the README) ----------------------------
  async function renderDoc(path, anchor) {
    const isRecipe = path !== "README.md";
    app.innerHTML = `<div class="page-narrow" style="width:100%"><p style="margin:0 0 30px"><a class="back" href="#/">← ${isRecipe ? "All recipes" : "Recipes"}</a></p><p class="muted">Loading…</p></div>`;
    const text = await fetchText(path);
    const r = anchor && recipes.find(x => x.path === path && x.anchor === anchor);
    const wrap = app.firstElementChild;
    wrap.lastElementChild.remove();
    const md = document.createElement("article");
    md.className = "md" + (isRecipe ? " recipe" : "");
    md.innerHTML = DOMPurify.sanitize(marked.parse(r ? r.markdown : text, { gfm: true }));
    md.querySelectorAll("h1,h2,h3").forEach(h => { h.id = slug(h.textContent); });
    // In-file index links (#anchor) should open that recipe, not jump the page.
    md.querySelectorAll('a[href^="#"]').forEach(a => {
      const id = a.getAttribute("href").slice(1);
      if (id && !id.startsWith("/")) a.setAttribute("href", `#/${path}/${id}`);
    });
    wrap.appendChild(md);
    const src = document.createElement("p");
    src.className = "source";
    src.innerHTML = `Source: <a href="https://github.com/${REPO}/blob/${BRANCH}/${encodeURI(path)}${r ? "#" + r.anchor : ""}">${esc(path)}</a>`;
    wrap.appendChild(src);
    window.scrollTo(0, 0);
  }

  async function route() {
    const h = decodeURI(location.hash.replace(/^#\/?/, ""));
    try {
      if (h === "about") return await renderDoc("README.md", null);
      const m = h.match(/^([^/]+\/[^/]+\.md)(?:\/(.+))?$/);
      if (m) return await renderDoc(m[1], m[2]);
      renderList();
    } catch (e) { showError(e); }
  }
  function showError(e) {
    app.innerHTML = `<div class="notice"><b>Couldn't load the recipes.</b> ${esc(e.message)}.
      If you opened this file directly from disk, serve the folder instead (for example the VS Code "Live Server" extension),
      or view it on GitHub Pages.</div>`;
  }

  window.addEventListener("hashchange", route);
  load().then(route).catch(showError);
})();
</script>
</body>
</html>
