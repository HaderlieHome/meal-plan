<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal Plan</title>
<meta name="description" content="High-protein, lazy, meal-prep friendly recipes for two.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  /*
    This page has no recipe content of its own. It lists the .md files in the
    repo (via the GitHub API), fetches them, and parses/renders them in the
    browser. Edit the Markdown; this page picks it up automatically.
  */
  :root {
    --bg: #faf7f2;
    --surface: #ffffff;
    --surface-2: #f3eee6;
    --text: #2a2622;
    --muted: #6f675e;
    --border: #e6ded2;
    --accent: #c2410c;
    --accent-soft: #fde7da;
    --freezer: #1d6fa5;
    --fridge: #4d7c0f;
    --fresh: #c2410c;
    --pantry: #8a6d3b;
    --shadow: 0 1px 2px rgba(42, 38, 34, .06), 0 4px 14px rgba(42, 38, 34, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1816;
      --surface: #23201d;
      --surface-2: #2c2825;
      --text: #efe9e1;
      --muted: #a89f94;
      --border: #3a3531;
      --accent: #fb8c4b;
      --accent-soft: #3d2518;
      --freezer: #6cb4e4;
      --fridge: #a3d15c;
      --fresh: #fb8c4b;
      --pantry: #d4b074;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1816;
    --surface: #23201d;
    --surface-2: #2c2825;
    --text: #efe9e1;
    --muted: #a89f94;
    --border: #3a3531;
    --accent: #fb8c4b;
    --accent-soft: #3d2518;
    --freezer: #6cb4e4;
    --fridge: #a3d15c;
    --fresh: #fb8c4b;
    --pantry: #d4b074;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--accent); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  header { padding: 32px 0 8px; }
  header h1 {
    font-family: Fraunces, Georgia, serif;
    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.1;
    margin: 0 0 6px;
  }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }
  .header-links { margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap; font-size: .92rem; }

  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 14px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 10px; }
  .tabs button, .chip, select, input[type="search"] {
    font: inherit; font-size: .92rem; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .tabs button[aria-pressed="true"], .chip[aria-pressed="true"] {
    background: var(--text); color: var(--bg); border-color: var(--text);
  }
  input[type="search"] { flex: 1 1 220px; min-width: 0; cursor: text; border-radius: 10px; padding: 8px 12px; }
  select { border-radius: 10px; padding: 8px 10px; }
  .label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
  .count { color: var(--muted); font-size: .9rem; margin-left: auto; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding-bottom: 48px; }
  .card {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow);
    text-decoration: none; color: inherit;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card .meta { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .card h3 { margin: 0; font-size: 1.05rem; line-height: 1.3; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
  .stat { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; }
  .stat b { display: block; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .72rem; color: var(--muted); }
  .foot { display: flex; justify-content: space-between; gap: 8px; font-size: .82rem; color: var(--muted); }
  .tag { font-weight: 600; white-space: nowrap; }
  .tag.freezer { color: var(--freezer); }
  .tag.fridge { color: var(--fridge); }
  .tag.fresh { color: var(--fresh); }
  .tag.pantry { color: var(--pantry); }

  .detail { max-width: 760px; margin: 0 auto; padding-bottom: 64px; }
  .back { display: inline-block; margin: 8px 0 16px; font-size: .95rem; text-decoration: none; }
  .md h1, .md h2 { font-family: Fraunces, Georgia, serif; line-height: 1.2; }
  .md h2 { font-size: 1.9rem; margin: 0 0 12px; }
  .md h3 { margin-top: 28px; font-size: 1.1rem; }
  .md table { border-collapse: collapse; width: 100%; font-size: .92rem; margin: 12px 0; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; white-space: nowrap; }
  .md th { background: var(--surface-2); }
  .md code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .md pre { background: var(--surface-2); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .md li { margin: 3px 0; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
  .source { font-size: .85rem; color: var(--muted); margin-top: 32px; }

  .notice { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; margin: 20px 0; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Meal Plan</h1>
    <p>High-protein, low-to-mid calorie meals for two. Lazy cooking, meal-prep friendly, and filling for the calories.</p>
    <div class="header-links">
      <a href="planner.html">Week planner &amp; shopping list</a>
      <a href="#/about">About the plan &amp; nutrition targets</a>
      <a id="repo-link" href="#">View on GitHub</a>
    </div>
  </header>
  <main id="app"><p class="empty">Loading recipes…</p></main>
</div>

<script>
(() => {
  // ---- Config -------------------------------------------------------------
  const REPO = "HaderlieHome/meal-plan";
  const BRANCH = "main";
  const MEAL_ORDER = ["Breakfast", "Lunch", "Dinner", "Snack"];
  const STORAGE = {
    freezer: { icon: "🧊", label: "Freezer" },
    fridge:  { icon: "🥡", label: "Fridge prep" },
    fresh:   { icon: "🔥", label: "Cook fresh" },
    pantry:  { icon: "🥫", label: "Pantry" },
  };

  document.getElementById("repo-link").href = `https://github.com/${REPO}`;
  const app = document.getElementById("app");
  const state = { meal: "All", protein: "All", storage: "All", q: "", sort: "default" };
  let recipes = [];
  let fileText = {};

  // ---- Helpers ------------------------------------------------------------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // GitHub-style heading slug, so anchors in the .md index lists match.
  const slug = s => s.toLowerCase().trim().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-");
  const pretty = s => s.replace(/-/g, " ").replace(/^\w/, c => c.toUpperCase());
  const num = s => (s == null ? null : parseFloat(String(s).replace(/,/g, "")));
  const ssGet = k => { try { return sessionStorage.getItem(k); } catch { return null; } };
  const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch {} };

  function storageKind(line) {
    if (!line) return "pantry";
    if (line.includes("🧊")) return "freezer";
    if (line.includes("🥡")) return "fridge";
    if (line.includes("🔥")) return "fresh";
    return "pantry";
  }

  function field(body, name) {
    const m = body.match(new RegExp(`\\*\\*${name}:\\*\\*\\s*([^·\\n]+)`));
    return m ? m[1].trim() : "";
  }
  function nutrient(body, name) {
    const m = body.match(new RegExp(`^\\|\\s*${name}\\s*\\|\\s*~?([\\d,.]+)`, "m"));
    return m ? num(m[1]) : null;
  }

  // ---- Parse one .md file into recipe objects -----------------------------
  function parseFile(path, text) {
    const [meal, file] = path.split("/");
    const protein = pretty(file.replace(/\.md$/, ""));
    return text.split(/^## /m).slice(1).map(chunk => {
      const nl = chunk.indexOf("\n");
      const title = chunk.slice(0, nl).trim();
      const body = chunk.slice(nl + 1);
      const storageLine = (body.match(/\*\*Storage:\*\*\s*(.+)/) || [])[1] || "";
      const time = field(body, "Time");
      return {
        path, meal, protein, title, anchor: slug(title),
        serves: field(body, "Serves"),
        time,
        handsOn: num((time.match(/hands-on\s*(\d+)/) || [])[1]),
        equipment: field(body, "Equipment"),
        kcal: nutrient(body, "Calories"),
        protein_g: nutrient(body, "Protein"),
        carbs: nutrient(body, "Carbs"),
        fat: nutrient(body, "Fat"),
        fiber: nutrient(body, "Fiber"),
        storage: storageKind(storageLine),
        markdown: "## " + chunk.trimEnd(),
      };
    });
  }

  // ---- Load: list .md files from the repo, then fetch each one ------------
  async function listFiles() {
    const cached = ssGet("mp-tree");
    if (cached) return JSON.parse(cached);
    const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const data = await res.json();
    const files = data.tree
      .map(t => t.path)
      .filter(p => /^[^/]+\/[^/]+\.md$/.test(p) && MEAL_ORDER.includes(p.split("/")[0]));
    ssSet("mp-tree", JSON.stringify(files));
    return files;
  }

  async function fetchText(path) {
    if (fileText[path]) return fileText[path];
    // Same-origin first (GitHub Pages / local server), raw GitHub as fallback.
    let res = await fetch(path, { cache: "no-cache" }).catch(() => null);
    if (!res || !res.ok) res = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${path}`);
    if (!res.ok) throw new Error(`Could not load ${path}`);
    return (fileText[path] = await res.text());
  }

  async function load() {
    const files = await listFiles();
    const texts = await Promise.all(files.map(fetchText));
    recipes = files.flatMap((f, i) => parseFile(f, texts[i]));
  }

  // ---- Views --------------------------------------------------------------
  function renderMarkdown(md) {
    const html = DOMPurify.sanitize(marked.parse(md, { gfm: true }));
    const div = document.createElement("div");
    div.className = "md";
    div.innerHTML = html;
    div.querySelectorAll("h1,h2,h3").forEach(h => { h.id = slug(h.textContent); });
    return div;
  }

  function filtered() {
    const q = state.q.toLowerCase();
    let list = recipes.filter(r =>
      (state.meal === "All" || r.meal === state.meal) &&
      (state.protein === "All" || r.protein === state.protein) &&
      (state.storage === "All" || r.storage === state.storage) &&
      (!q || (r.title + " " + r.equipment + " " + r.protein).toLowerCase().includes(q))
    );
    const by = {
      default: (a, b) => MEAL_ORDER.indexOf(a.meal) - MEAL_ORDER.indexOf(b.meal) || a.protein.localeCompare(b.protein),
      kcal: (a, b) => (a.kcal ?? 1e9) - (b.kcal ?? 1e9),
      protein: (a, b) => (b.protein_g ?? 0) - (a.protein_g ?? 0),
      density: (a, b) => density(b) - density(a),
      handsOn: (a, b) => (a.handsOn ?? 1e9) - (b.handsOn ?? 1e9),
    }[state.sort];
    return list.slice().sort(by);
  }
  const density = r => (r.kcal && r.protein_g ? r.protein_g / r.kcal * 100 : 0);

  function card(r) {
    const s = STORAGE[r.storage];
    return `<a class="card" href="#/${encodeURI(r.path)}/${r.anchor}">
      <div class="meta">${esc(r.meal)} · ${esc(r.protein)}</div>
      <h3>${esc(r.title)}</h3>
      <div class="stats">
        <div class="stat"><b>${r.kcal ?? "–"}</b><span>kcal</span></div>
        <div class="stat"><b>${r.protein_g ?? "–"}g</b><span>protein</span></div>
        <div class="stat"><b>${r.fiber ?? "–"}g</b><span>fiber</span></div>
      </div>
      <div class="foot">
        <span class="tag ${r.storage}">${s.icon} ${s.label}</span>
        <span>${r.handsOn != null ? r.handsOn + " min hands-on" : esc(r.time)}</span>
      </div>
    </a>`;
  }

  function chips(name, values, labelFn = v => v) {
    return ["All", ...values].map(v =>
      `<button class="chip" data-${name}="${esc(v)}" aria-pressed="${state[name] === v}">${esc(v === "All" ? "All" : labelFn(v))}</button>`
    ).join("");
  }

  function renderList() {
    const proteins = [...new Set(recipes.filter(r => state.meal === "All" || r.meal === state.meal).map(r => r.protein))].sort();
    if (state.protein !== "All" && !proteins.includes(state.protein)) state.protein = "All";
    const list = filtered();
    app.innerHTML = `
      <div class="controls">
        <div class="row tabs">
          ${["All", ...MEAL_ORDER].map(m => `<button data-meal="${m}" aria-pressed="${state.meal === m}">${m}</button>`).join("")}
          <span class="count">${list.length} of ${recipes.length} recipes</span>
        </div>
        <div class="row"><span class="label">Protein</span>${chips("protein", proteins)}</div>
        <div class="row"><span class="label">Storage</span>${chips("storage", Object.keys(STORAGE), k => STORAGE[k].icon + " " + STORAGE[k].label)}</div>
        <div class="row">
          <input type="search" id="q" placeholder="Search recipes, equipment…" value="${esc(state.q)}">
          <select id="sort" aria-label="Sort">
            <option value="default">Sort: meal & protein</option>
            <option value="kcal">Lowest calories</option>
            <option value="protein">Most protein</option>
            <option value="density">Most protein per calorie</option>
            <option value="handsOn">Least hands-on time</option>
          </select>
        </div>
      </div>
      <div class="grid">${list.map(card).join("") || `<p class="empty">No recipes match.</p>`}</div>`;
    app.querySelector("#sort").value = state.sort;
    app.querySelectorAll("[data-meal]").forEach(b => b.onclick = () => { state.meal = b.dataset.meal; renderList(); });
    app.querySelectorAll("[data-protein]").forEach(b => b.onclick = () => { state.protein = b.dataset.protein; renderList(); });
    app.querySelectorAll("[data-storage]").forEach(b => b.onclick = () => { state.storage = b.dataset.storage; renderList(); });
    app.querySelector("#sort").onchange = e => { state.sort = e.target.value; renderList(); };
    const q = app.querySelector("#q");
    q.oninput = () => {
      state.q = q.value;
      app.querySelector(".grid").innerHTML = filtered().map(card).join("") || `<p class="empty">No recipes match.</p>`;
      app.querySelector(".count").textContent = `${filtered().length} of ${recipes.length} recipes`;
    };
  }

  async function renderDoc(path, anchor) {
    app.innerHTML = `<div class="detail"><a class="back" href="#/">← All recipes</a><p class="empty">Loading…</p></div>`;
    const text = await fetchText(path);
    const r = anchor && recipes.find(x => x.path === path && x.anchor === anchor);
    const detail = app.querySelector(".detail");
    detail.querySelector(".empty").remove();
    detail.appendChild(renderMarkdown(r ? r.markdown : text));
    const src = document.createElement("p");
    src.className = "source";
    src.innerHTML = `Source: <a href="https://github.com/${REPO}/blob/${BRANCH}/${encodeURI(path)}${r ? "#" + r.anchor : ""}">${esc(path)}</a>`;
    detail.appendChild(src);
    // In-file index links (#anchor) should open that recipe, not jump the page.
    detail.querySelectorAll('a[href^="#"]:not(.back)').forEach(a => {
      const id = a.getAttribute("href").slice(1);
      if (id && !id.startsWith("/")) a.setAttribute("href", `#/${path}/${id}`);
    });
    window.scrollTo(0, 0);
  }

  async function route() {
    const h = decodeURI(location.hash.replace(/^#\/?/, ""));
    try {
      if (h === "about") return renderDoc("README.md", null);
      const m = h.match(/^([^/]+\/[^/]+\.md)(?:\/(.+))?$/);
      if (m) return renderDoc(m[1], m[2]);
      renderList();
    } catch (e) { showError(e); }
  }

  function showError(e) {
    app.innerHTML = `<div class="notice"><b>Couldn't load the recipes.</b><br>${esc(e.message)}.
      If you opened this file directly from disk, serve the folder instead (for example the VS Code "Live Server" extension),
      or view it on GitHub Pages.</div>`;
  }

  window.addEventListener("hashchange", route);
  load().then(route).catch(showError);
})();
</script>
</body>
</html>
